<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboards</title>
<style>
:root{--bg:#fff;--fg:#222;--mute:#777;--line:#ddd;--card:#f5f6f8;--accent:#2a5db0}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e8e8;--mute:#9aa0a6;--line:#2c3036;--card:#1f2228;--accent:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Arial,Helvetica,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 16px 60px}
h1{margin:0 0 4px;font-size:28px}
p.sub{margin:0 0 22px;color:var(--mute)}
input{width:100%;max-width:340px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.card{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card img{width:44px;height:44px;object-fit:contain;flex:none}
a.card .t{font-weight:700;color:var(--accent)}
a.card .m{font-size:13px;color:var(--mute);margin-top:2px}
#msg{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Scoreboards</h1>
  <p class="sub">Pick a contest to open its live scoreboard replay.</p>
  <input id="f" type="search" placeholder="Search contests" hidden>
  <div class="grid" id="grid"></div>
  <p id="msg">Loading contests…</p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async () => {
  let metas = [];
  try { const r = await fetch('contests/index.json', { cache: 'no-cache' }); if (r.ok) metas = await r.json(); } catch (e) {}
  if (!metas.length) { $('msg').textContent = 'No contests found yet. Put a scraped scoreboard folder into the "scoreboards" folder of the repository.'; return; }
  $('msg').hidden = true; $('f').hidden = false;
  const draw = () => {
    const q = $('f').value.trim().toLowerCase();
    $('grid').innerHTML = metas.filter(m => !q || (m.title + ' ' + m.id).toLowerCase().includes(q)).map(m =>
      `<a class="card" href="contests/${encodeURIComponent(m.id)}/">` +
      (m.logo ? `<img src="contests/${encodeURIComponent(m.id)}/${esc(m.logo)}" alt="" onerror="this.remove()">` : '') +
      `<div><div class="t">${esc(m.title)}</div><div class="m">${m.participants || 0} contestants · ${(m.tasks || []).length} problems</div></div></a>`).join('');
  };
  $('f').oninput = draw; draw();
})();
</script>
</body>
</html>
