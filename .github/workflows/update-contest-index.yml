name: Update contest index

# Keeps scoreboards/index.json in sync with the folders in scoreboards/ (the home page also works without it).
on:
  push:
    paths:
      - "scoreboards/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild scoreboards/index.json
        run: python3 tools/make_index.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scoreboards/index.json
          git diff --cached --quiet || (git commit -m "update contest index" && git push)
