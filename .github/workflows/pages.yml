name: Build and deploy the scoreboard website

# Runs whenever you add / change something in scoreboards/ (or the viewer in tools/),
# builds the site with tools/build_site.py and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "scoreboards/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
